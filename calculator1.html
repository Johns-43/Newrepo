<script>

operator = prompt("Enter the operation sign");

number1 = Number(prompt("Enter the first number"));

number2 = Number(prompt("Enter the second number"));

if(operator == "+")
{
document.write("Sum: "+(number1+number2));
}

else if(operator == "-")
{
document.write("Difference: "+(number1-number2));
}

else if(operator == "*")
{
document.write("Multiplication: "+(number1*number2));
}

else if(operator == "/")
{
document.write("Division: "+(number1/number2));
}

else
{
document.write("Invalid Operator");
}

</script>

<script>

class Health
{
	constructor()
	{

		this.health_data = {
		male:{150:"50",152:"53",154:"56",156:"59",158:"62",160:"65",162:"68",164:"71",166:"74",168:"77"},
		female:{150:"45",152:"48",154:"51",156:"54",158:"57",160:"60",162:"63",164:"66",166:"69",168:"72"}
		};
	
	}

	report(gender,height,weight)
	{
		if(gender=="male")
		{
			let c = 0;
			for(let h in this.health_data[gender])
			{
				if(h == height)
				{
					c=1;
					if(this.health_data[gender][height] == weight)
					{
					document.write("No need to change weight and it is adequate");
					}
					else if(this.health_data[gender][height] >= weight)
					{
					document.write("Need to increase weight by "+(this.health_data[gender][height]-weight));
					}
					else
					{
					document.write("Need to decrease weight by "+(weight-this.health_data[gender][height]));
					}
					break;
				}

			}
			if(c==0)
			{
				document.write("Height not available in data to report health");
			}
		}
		else
		{
			let c = 0;
			for(let h in this.health_data[gender])
			{
				if(h == height)
				{
					c=1;
					if(this.health_data[gender][height] == weight)
					{
					document.write("No need to change weight and it is adequate");
					}
					else if(this.health_data[gender][height] >= weight)
					{
					document.write("Need to increase weight by "+(this.health_data[gender][height]-weight));
					}
					else
					{
					document.write("Need to decrease weight by "+(weight-this.health_data[gender][height]));
					}
					break;
				}
			}
			if(c==0)
			{
				document.write("Height not available in data to report health");
			}
		}

	}
}

let patient = new Health();

let gender = prompt("Enter the gender");
let height = Number(prompt("Enter the height"));
let weight = Number(prompt("Enter the weight"));

patient.report(gender,height,weight);

</script>
